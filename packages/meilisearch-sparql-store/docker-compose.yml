services:
  meilisearch:
    image: getmeili/meilisearch:v1.12
    ports:
      # Host 7701 avoids clash with a system Meilisearch often bound on 7700.
      - "7701:7700"
    environment:
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 3s
      timeout: 3s
      retries: 20
